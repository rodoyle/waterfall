[package]
name = "waterfall"
version = "0.1.0"
edition = "2021"

[dependencies]
rustfft = "6.1.0"       # For CPU FFT computation
rayon = "1.8.1"         # For parallel processing
rand = "0.8.5"          # For random data generation in tests
num-complex = "0.4.4"   # For Complex numbers
# Bridge server (Milestone M1)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[features]
mlx = ["dep:mlx-sys"] # Enable MLX acceleration when this feature is selected

[target.'cfg(target_os = "macos")'.dependencies]
mlx-sys = { version = "0.2.0", optional = true } # Apple MLX only

[profile.release]
lto = true        # Enable Link Time Optimization for release builds
codegen-units = 1 # Reduce code generation units for better optimization
panic = 'abort'   # Abort on panic for performance
strip = true      # Strip symbols for smaller binary size
