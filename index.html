<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfall Plot Visualizer</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background-color: #0a0a0a; }
        canvas { display: block; }
        /* Lightweight controls panel (plan step 3): no framework, reuses the
           existing `config` object in main.js. Collapsible so it stays out of
           the way of the spectrogram. */
        #controls {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            color: #eee;
            font: 12px/1.4 sans-serif;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            max-width: 230px;
        }
        #controls.collapsed > :not(#controlsToggle) { display: none; }
        #controlsToggle { cursor: pointer; font-weight: bold; user-select: none; }
        #controls .row { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; gap: 8px; }
        #controls label { opacity: 0.85; }
        #controls input[type="number"] { width: 64px; background: #111; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 1px 3px; }
        #controls select { background: #111; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 1px 3px; }
        #controls button { background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
        #controls button.running { border-color: #4a4; }
    </style>
</head>
<body>
    <a href="/palantir.html" style="position:fixed;z-index:20;top:8px;left:8px;color:#ddd;font:12px sans-serif;text-decoration:none">✦ Palantir view</a>
    <canvas id="waterfallCanvas"></canvas>
    <div id="controls">
        <div id="controlsToggle">Controls ▾</div>
        <div class="row"><label>Bin&nbsp;count</label><input id="ctlNumBins" type="number" min="16" max="4096" step="16" value="256"></div>
        <div class="row"><label>Rows</label><input id="ctlNumRows" type="number" min="16" max="2000" step="8" value="220"></div>
        <div class="row"><label>Sweep&nbsp;ms</label><input id="ctlSweepMs" type="number" min="10" max="2000" step="10" value="90"></div>
        <div class="row"><label>dB&nbsp;min</label><input id="ctlDbMin" type="number" min="-160" max="0" step="1" value="-100"></div>
        <div class="row"><label>dB&nbsp;max</label><input id="ctlDbMax" type="number" min="-160" max="0" step="1" value="0"></div>
        <div class="row"><label>Freq&nbsp;axis</label>
            <select id="ctlFreqScale">
                <option value="linear">linear</option>
                <option value="log">log</option>
            </select>
        </div>
        <div class="row"><button id="ctlRunPause" class="running">Pause</button></div>
    </div>
    <script src="dataClient.js"></script>
    <script src="main.js"></script>
</body>
</html>
