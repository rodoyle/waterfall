# waterfall-consumer — the signal-middleware tier.
#
# Binds UDP 4820, parses the VITA 49 stream sigproc pushes, converts sc16 -> i8,
# runs the STFT over every packet, and POSTs paced rows to waterfall-bridge.
#
# The Service name `waterfall-service` is hardcoded in the sigproc ConfigMap
# (vita49_dest_host) and MUST stay exactly that; sigproc resolves it once and
# caches the result, so the consumer must be Ready before this Service exists
# (see deploy/README.md for the apply order).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waterfall-consumer
  namespace: default
  labels:
    app: waterfall-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waterfall-consumer
  template:
    metadata:
      labels:
        app: waterfall-consumer
    spec:
      # Placement is a CONSTRAINT, not a pin: choose any amd64 node that is not
      # the SDR node (rpi-four-2) or the control plane (sab-laptop-1). The
      # image is linux/amd64, so amd64 is required by the image anyway; the
      # NotIn keeps the live RF stream off the SDR node and the control plane.
      # The infra agent may replace this with node labels/taints if preferred.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-four-2, sab-laptop-1]
          # SOFT steering only. On 2026-09-20 med-laptop-1 was flapping
          # (NodeNotReady <-> NodeReady about once a minute), and every stall
          # dropped live datagrams: the consumer held a steady 976.5 pkt/s with
          # zero gaps while that node was healthy. This preference keeps the
          # workload on a permitted node (both are med-laptop-*) while avoiding
          # the unstable one; the infra agent may replace it with cluster-level
          # labels/taints.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [med-laptop-2]
      imagePullSecrets:
        - name: ghcr-pull
      # NOTE on the receive buffer: the consumer requests SO_RCVBUF = 8 MiB, but
      # the kernel caps it at net.core.rmem_max (default 212992; read back as
      # 425984) = ~50 ms of the live ~8 MB/s stream. Two mechanisms to raise it
      # were tried and both are unavailable from inside this repo:
      #   * `securityContext.sysctls` -> passes API validation but the kubelet
      #     rejects it at admission with SysctlForbidden (it is an "unsafe"
      #     sysctl), and
      #   * a privileged initContainer -> /proc/sys/net is not writable in this
      #     runtime (the write fails; no net.core directory is visible).
      # The cluster-level fix is the kubelet flag
      # `--allowed-unsafe-sysctls=net.core.rmem_max` (infra agent's call).
      # Measured impact of leaving it capped: on a stable node the consumer
      # holds 976.6 pkt/s with gaps = 0 and stft_dropped = 0, so this is a
      # robustness margin for node stalls rather than a functional gap -- the
      # multi-second outages observed were traced to med-laptop-1 flapping.
      containers:
        - name: waterfall-consumer
          image: ghcr.io/rodoyle/waterfall:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/waterfall-consumer"]
          args:
            - --listen=0.0.0.0:4820
            - --bridge-url=http://waterfall-ui.default.svc.cluster.local:4780
            - --center-freq=915000000
            - --sample-rate=2000000
            - --publish-hz=30
            - --stats-listen=0.0.0.0:4830
            - --rcvbuf=8388608
            # Spike the first 3 datagrams to the log on every pod start, so the
            # transport is proven before trusting the parser.
            - --hexdump-first=3
            # Capture one real sigproc datagram for the committed test fixture
            # (retrieved with `kubectl exec ... -- cat`).
            - --capture-fixture=/tmp/sigproc-datagram.bin
          ports:
            - name: vita49
              containerPort: 4820
              protocol: UDP
            - name: stats
              containerPort: 4830
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
          # SO_RCVBUF needs to absorb ~8 MB/s of fragmented datagrams. The
          # readiness probe is the consumer's own /healthz on the stats port.
          readinessProbe:
            httpGet:
              path: /healthz
              port: stats
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: stats
            initialDelaySeconds: 10
            periodSeconds: 20
# NOTE: the Service that sigproc resolves (`waterfall-service`) deliberately
# lives in its own file, deploy/waterfall-service.yaml, so it can be applied
# LAST — after this Deployment is Ready and bound to UDP 4820. See
# deploy/README.md for why that ordering is load-bearing.
