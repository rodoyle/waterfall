# waterfall-service — the DNS name sigproc is ALREADY sending to.
#
# This file is separate from waterfall-consumer.yaml on purpose. sigproc
# resolves `waterfall-service.default.svc.cluster.local` once and caches the
# result, retrying only while unresolved. Creating this Service is the trigger
# that makes it start forwarding, so it must be applied LAST:
#
#   1. waterfall-consumer.yaml  -> Deployment Ready, bound to UDP 4820
#   2. waterfall-bridge.yaml    -> web tier Ready
#   3. THIS FILE                -> sigproc resolves and forwarding begins
#
# Creating it earlier means sigproc's one-shot resolution succeeds while nothing
# is listening, and (because the lookup succeeded) it never retries: the first
# datagrams are simply lost forever.
#
# The name `waterfall-service` is hardcoded in the sigproc ConfigMap
# (`vita49_dest_host`) and must not be renamed.
#
# UDP 4820 is the VITA 49 stream; TCP 4830 is the consumer's stats/healthz,
# kept here so a single port-forward exposes both the transport and the loss
# counters.
apiVersion: v1
kind: Service
metadata:
  name: waterfall-service
  namespace: default
  labels:
    app: waterfall-consumer
spec:
  selector:
    app: waterfall-consumer
  ports:
    - name: vita49
      port: 4820
      targetPort: vita49
      protocol: UDP
    - name: stats
      port: 4830
      targetPort: stats
      protocol: TCP
