# orbweaver — public entry point for the UI.
#
# Routing shape only: the public HOST is environment content and lives in the
# overlay (overlays/default/kustomization.yaml patches spec.rules[0].host). The
# rule below deliberately has no host, so the base stays environment-agnostic.
#
# Served by the cluster's traefik ingress controller (the default ingress class)
# on port 80. LAN DNS for `*.apps.home.arpa` comes from coredns-lan in the
# `lan-dns` namespace, so no per-device hosts entry is required.
#
# HTTP only: the stack is LAN-only and read-only (a spectrum display plus a
# WebSocket), so there is no credential to protect and no certificate to renew.
# Adding TLS later needs only a `tls:` block here (or in the overlay).
#
# One route covers everything the UI needs: `path: /` matches /, /ws, /chunks,
# /meta and /stats on the same origin, and traefik upgrades websockets on an
# ordinary HTTP route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbweaver
  namespace: default
  labels:
    app.kubernetes.io/name: orbweaver
    app.kubernetes.io/part-of: orbweaver
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbweaver-ui
                port:
                  number: 4780
