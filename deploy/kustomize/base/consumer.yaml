# orbweaver-consumer — the signal-middleware tier.
#
# Binds UDP 4820, parses the VITA 49 stream sigproc pushes, converts sc16 -> i8,
# runs the STFT over every packet, and POSTs paced rows to the web tier.
#
# LABEL COMPATIBILITY (load-bearing): sigproc resolves the DNS name
# `waterfall-service.default.svc.cluster.local` ONCE at startup and cached the
# IP, so that legacy Service cannot be renamed or recreated without interrupting
# the live RF stream. It selects `app: waterfall-consumer`, so this Deployment
# keeps that label on its pods while ALSO carrying the canonical
# `app.kubernetes.io/name: orbweaver-consumer`. Both Services therefore select
# the same pods and the rename is invisible to sigproc. See deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbweaver-consumer
  namespace: default
  labels:
    app.kubernetes.io/name: orbweaver-consumer
    app.kubernetes.io/part-of: orbweaver
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbweaver-consumer
  template:
    metadata:
      labels:
        # Canonical identity (selected by the orbweaver-service).
        app.kubernetes.io/name: orbweaver-consumer
        app.kubernetes.io/part-of: orbweaver
        app.kubernetes.io/component: middleware
        # COMPAT: the legacy `waterfall-service` Service selects this label, and
        # sigproc has its ClusterIP cached. Do not remove until sigproc's
        # vita49_dest_host has been migrated (deploy/README.md has the steps).
        app: waterfall-consumer
    spec:
      # Placement is a CONSTRAINT, not a pin: any amd64 node that is not the SDR
      # node (rpi-four-2) or the control plane (sab-laptop-1). amd64 is required
      # by the image anyway; the NotIn keeps the live RF stream off the SDR node
      # and the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-four-2, sab-laptop-1]
          # SOFT steering only: med-laptop-1 was flapping NodeNotReady/NodeReady
          # about once a minute, and each stall dropped live datagrams while the
          # stream held 976.5 pkt/s with zero gaps when that node was healthy.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [med-laptop-2]
      imagePullSecrets:
        - name: ghcr-pull
      # NOTE on the receive buffer: the consumer requests SO_RCVBUF = 8 MiB, but
      # the kernel caps it at net.core.rmem_max (default 212992; read back as
      # 425984) = ~50 ms of the live ~8 MB/s stream. Both in-repo remedies are
      # unavailable: `securityContext.sysctls` passes API validation but the
      # kubelet rejects it with SysctlForbidden, and a privileged initContainer
      # cannot write /proc/sys/net in this runtime. The cluster-level fix is the
      # kubelet flag `--allowed-unsafe-sysctls=net.core.rmem_max`. Measured
      # impact of leaving it capped: none in steady state (976.6 pkt/s,
      # gaps = 0, stft_dropped = 0); it is robustness margin for node stalls.
      containers:
        - name: orbweaver-consumer
          image: ghcr.io/rodoyle/waterfall:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/waterfall-consumer"]
          args:
            - --listen=0.0.0.0:4820
            - --bridge-url=http://orbweaver-ui.default.svc.cluster.local:4780
            - --center-freq=915000000
            - --sample-rate=2000000
            - --publish-hz=30
            - --stats-listen=0.0.0.0:4830
            - --rcvbuf=8388608
            # Spike the first 3 datagrams to the log on every pod start, so the
            # transport is proven before trusting the parser.
            - --hexdump-first=3
            # Capture one real sigproc datagram for the committed test fixture
            # (retrieved with `kubectl exec ... -- cat`).
            - --capture-fixture=/tmp/sigproc-datagram.bin
          ports:
            - name: vita49
              containerPort: 4820
              protocol: UDP
            - name: stats
              containerPort: 4830
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: stats
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: stats
            initialDelaySeconds: 10
            periodSeconds: 20
