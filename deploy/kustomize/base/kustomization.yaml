apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Canonical orbweaver stack: middleware (consumer) + web tier (bridge), their
# Services, and the Ingress.
#
# The legacy Service that sigproc resolves is NOT part of this base: it lives in
# ../compat/waterfall-service.yaml (frozen, pinned ClusterIP) and is pulled into
# the app overlay, so the base stays purely canonical while the single
# `kubectl apply -k deploy/kustomize/overlays/default` still reconciles
# everything. See deploy/README.md for the apply order and retirement steps.
resources:
  - consumer.yaml
  - bridge.yaml
  - services.yaml
  - ingress.yaml
