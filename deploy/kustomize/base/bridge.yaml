# orbweaver-bridge — the web tier.
#
# Serves the front end (static files from /app/static in the image) and the
# WebSocket/REST row stream, fed by POST /ingest from the middleware tier. NO
# synthetic fallback (--source=ingest): a dead RF feed reports stale on /meta
# instead of fabricating rows, because fabricated rows look exactly like real
# signal on a waterfall.
#
# The UI is served by this process rather than a separate nginx pod: it already
# has the assets and the data endpoints, so one origin covers /, /ws, /chunks,
# /meta and /stats, and websockets need no extra Ingress route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbweaver-bridge
  namespace: default
  labels:
    app.kubernetes.io/name: orbweaver-bridge
    app.kubernetes.io/part-of: orbweaver
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbweaver-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbweaver-bridge
        app.kubernetes.io/part-of: orbweaver
        app.kubernetes.io/component: web
        app: orbweaver-bridge
    spec:
      # Same placement constraint as the middleware tier: amd64, and never the
      # SDR node or the control plane. See consumer.yaml for the rationale.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-four-2, sab-laptop-1]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [med-laptop-2]
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: orbweaver-bridge
          image: ghcr.io/rodoyle/waterfall:latest
          imagePullPolicy: Always
          # The image ENTRYPOINT is the bridge; args select the producer.
          command: ["/usr/local/bin/waterfall"]
          args:
            - --source=ingest
            - --static=/app/static
            - --center-freq=915000000
            - --sample-rate=2000000
          ports:
            - name: http
              containerPort: 4780
              protocol: TCP
          env:
            - name: WATERFALL_LISTEN
              value: 0.0.0.0:4780
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /meta
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /meta
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
