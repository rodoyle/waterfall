apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The one deployed environment: namespace `default`, image tag `latest` (the tag
# this repo's kaniko Job pushes). Pin a digest here instead if a frozen rollout
# is ever required.
#
# `kubectl apply -k deploy/kustomize/overlays/default` is the SINGLE deploy path
# for the whole stack. It includes the frozen legacy Service from ../../compat,
# which is what sigproc resolves: keeping it in this overlay means one apply
# reconciles everything, and the file stays separate so it can be re-asserted on
# its own (`kubectl apply -k deploy/kustomize/compat`) without touching the
# canonical objects. Applying it is a no-op against the live cluster.
namespace: default
resources:
  - ../../base
  # Directory reference, not the bare file: kustomize's load restrictor rejects
  # raw resources outside the overlay root, but a nested kustomization is fine.
  - ../../compat
images:
  - name: ghcr.io/rodoyle/waterfall
    newTag: latest
patches:
  # The public host is per-environment content: it is supplied HERE, not in the
  # base (which keeps only the routing shape). JSON6902 `add` is used because
  # Ingress rules have no patch-merge key, so a strategic merge would replace
  # the whole rule list.
  - target:
      kind: Ingress
      name: orbweaver
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: orbweaver.apps.home.arpa
