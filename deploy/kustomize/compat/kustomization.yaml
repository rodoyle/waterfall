apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The legacy Service that sigproc resolves, captured verbatim from the cluster
# so it is in git and can never be forgotten.
#
# waterfall-service.yaml is ALSO included by the app overlay
# (overlays/default/kustomization.yaml), so the normal single deploy path
# reconciles it too. This root exists so the object can be re-asserted on its
# own without touching the canonical objects:
#
#   kubectl apply -k deploy/kustomize/compat
#
# Applying it is a no-op against the live cluster (verified with
# --dry-run=server). See waterfall-service.yaml for why every field is frozen.
resources:
  - waterfall-service.yaml
